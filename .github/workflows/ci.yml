name: Loopkeeper CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install isolated development dependencies
        run: python -m pip install --upgrade pip && python -m pip install ".[dev]"
      - name: Build distribution artifacts for release-contract tests
        run: python -m build --sdist --wheel
      - name: Run unit, adapter, workflow, and integration suites
        run: python -m pytest -q
      - name: Build and install the production wheel without dependencies
        run: |
          python -m build --wheel
          rm -rf /tmp/loopkeeper-clean-install
          mkdir -p /tmp/loopkeeper-clean-install/site
          python -m pip install --no-deps --target /tmp/loopkeeper-clean-install/site dist/loopkeeper-*.whl

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Record runner tool versions
        run: |
          set -euo pipefail
          bash --version | head -n 1
          git --version
          gh --version | head -n 1
          jq --version
          python3 --version
          {
            echo "### Runner tools"
            bash --version | head -n 1
            git --version
            gh --version | head -n 1
            jq --version
            python3 --version
          } >>"$GITHUB_STEP_SUMMARY"
      - name: Run shell and automation contracts
        run: tests/github/test_automation.sh

  workflow-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            --output "$archive"
          echo "${ACTIONLINT_SHA256}  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          test -x "$RUNNER_TEMP/actionlint"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Validate workflow YAML with pinned actionlint
        run: |
          command -v actionlint >/dev/null 2>&1
          actionlint
