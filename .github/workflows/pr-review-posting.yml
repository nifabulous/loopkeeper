name: Loopkeeper PR Review (posting reusable)

on:
  workflow_call:
    inputs:
      consumer_repo:
        type: string
        required: true
      loopkeeper_repo:
        type: string
        required: true
      consumer_trusted_sha:
        type: string
        required: false
        default: ""
      loopkeeper_sha:
        type: string
        required: true
      ci_workflow_name:
        type: string
        required: true
      ci_workflow_file:
        type: string
        required: true
      job_timeout_seconds:
        type: number
        required: false
        default: 1200
      post_comments:
        type: boolean
        required: false
        default: true
      pr_number:
        type: number
        required: false
        default: 0
      expected_head_sha:
        type: string
        required: false
        default: ""
      policy_path:
        type: string
        required: false
        default: ".github/codex/review-policy.md"
      contract_path:
        type: string
        required: false
        default: ""
      context_path:
        type: string
        required: false
        default: ".github/codex/context-files.txt"
    secrets:
      model_api_key:
        required: true

permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      consumer_trusted_sha: ${{ steps.roots.outputs.consumer_trusted_sha }}
      consumer_default_branch: ${{ steps.roots.outputs.consumer_default_branch }}
    steps:
      - name: Resolve immutable inputs and consumer trust root
        id: roots
        env:
          GH_TOKEN: ${{ github.token }}
          CONSUMER_REPO: ${{ inputs.consumer_repo }}
          LOOPKEEPER_REPO: ${{ inputs.loopkeeper_repo }}
          CONSUMER_TRUSTED_HINT: ${{ inputs.consumer_trusted_sha }}
          LOOPKEEPER_SHA: ${{ inputs.loopkeeper_sha }}
          JOB_TIMEOUT_SECONDS: ${{ inputs.job_timeout_seconds }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CONSUMER_REPO" =~ ^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$ ]] || { echo "consumer_repo must be owner/name" >&2; exit 2; }
          [[ "$LOOPKEEPER_REPO" =~ ^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$ ]] || { echo "loopkeeper_repo must be owner/name" >&2; exit 2; }
          [[ "$LOOPKEEPER_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "loopkeeper_sha must be a full lowercase SHA" >&2; exit 2; }
          [[ "$JOB_TIMEOUT_SECONDS" =~ ^[1-9][0-9]*$ ]] || { echo "job_timeout_seconds must be positive" >&2; exit 2; }
          default_branch="$(gh api "repos/${CONSUMER_REPO}" --jq '.default_branch')"
          [[ "$default_branch" =~ ^[A-Za-z0-9._/-]+$ && "$default_branch" != /* && "$default_branch" != *..* ]] || { echo "forge returned an unsafe default branch" >&2; exit 4; }
          consumer_sha="$(gh api "repos/${CONSUMER_REPO}/git/ref/heads/${default_branch}" --jq '.object.sha')"
          [[ "$consumer_sha" =~ ^[0-9a-f]{40}$ ]] || { echo "forge did not return a full consumer SHA" >&2; exit 4; }
          if [[ -n "$CONSUMER_TRUSTED_HINT" && "$CONSUMER_TRUSTED_HINT" != "$consumer_sha" ]]; then
            echo "consumer_trusted_sha hint differs from forge tip; using forge tip" >&2
          fi
          {
            echo "consumer_trusted_sha=$consumer_sha"
            echo "consumer_default_branch=$default_branch"
          } >>"$GITHUB_OUTPUT"

  # Fork authorization. This job holds NO model secret: an unapproved fork must
  # not be able to reach a paid model call, so the secret is mapped only in the
  # job gated on this one's literal `eligible=true` output.
  #
  # It re-fetches the pull request rather than trusting the event payload,
  # because an event is a snapshot and label state can change after it fires.
  eligibility:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      issues: read
    outputs:
      eligible: ${{ steps.decide.outputs.eligible }}
      reason: ${{ steps.decide.outputs.reason }}
    steps:
      - name: Check out Loopkeeper at immutable release SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.loopkeeper_repo }}
          ref: ${{ inputs.loopkeeper_sha }}
          path: loopkeeper
          fetch-depth: 1
      - name: Verify Loopkeeper checkout before trusted reads
        env:
          LOOPKEEPER_SHA: ${{ inputs.loopkeeper_sha }}
        run: |
          set -euo pipefail
          [[ "$(git -C loopkeeper rev-parse HEAD)" == "$LOOPKEEPER_SHA" ]]
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Resolve fork eligibility
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ inputs.consumer_repo }}
          PYTHONPATH: ${{ github.workspace }}/loopkeeper/src
          LOOPKEEPER_CHECK_MAX_RAW_BYTES: ${{ vars.LOOPKEEPER_CHECK_MAX_RAW_BYTES || '200000' }}
        run: |
          set -euo pipefail
          pr_number="${{ inputs.pr_number }}"
          if [[ "$pr_number" == "0" ]]; then
            pr_number="${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number }}"
          fi
          [[ "$pr_number" =~ ^[1-9][0-9]*$ ]] || { echo "a PR number is required" >&2; exit 2; }
          "$GITHUB_WORKSPACE/loopkeeper/adapters/github/resolve_pr_eligibility.sh" "$pr_number"
      - name: Report the decision
        if: always()
        env:
          ELIGIBLE: ${{ steps.decide.outputs.eligible }}
          REASON: ${{ steps.decide.outputs.reason }}
          OUTCOME: ${{ steps.decide.outcome }}
        run: |
          set -euo pipefail
          {
            echo "## Loopkeeper eligibility"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Eligible | \`${ELIGIBLE:-unknown}\` |"
            echo "| Reason | \`${REASON:-unavailable}\` |"
            echo "| Probe | \`$OUTCOME\` |"
          } >>"$GITHUB_STEP_SUMMARY"

  review:
    # The model secret is mapped in this job, so it may only start on a
    # literal eligible=true. A missing or non-true output blocks it.
    needs: [resolve, eligibility]
    if: ${{ needs.eligibility.outputs.eligible == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      artifact_available: ${{ steps.artifact_status.outputs.available }}
    concurrency:
      group: loopkeeper-pr-review-${{ inputs.consumer_repo }}-${{ inputs.pr_number || github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || github.run_id }}
      cancel-in-progress: true
    steps:
      - name: Check out consumer at forge-verified default-branch SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.consumer_repo }}
          ref: ${{ needs.resolve.outputs.consumer_trusted_sha }}
          path: consumer
          fetch-depth: 1

      - name: Check out Loopkeeper at immutable release SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.loopkeeper_repo }}
          ref: ${{ inputs.loopkeeper_sha }}
          path: loopkeeper
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify both checkouts before trusted reads
        env:
          CONSUMER_TRUSTED_SHA: ${{ needs.resolve.outputs.consumer_trusted_sha }}
          LOOPKEEPER_SHA: ${{ inputs.loopkeeper_sha }}
        run: |
          set -euo pipefail
          [[ "$(git -C consumer rev-parse HEAD)" == "$CONSUMER_TRUSTED_SHA" ]]
          [[ "$(git -C loopkeeper rev-parse HEAD)" == "$LOOPKEEPER_SHA" ]]

      - name: Run read-only review
        id: run_review
        working-directory: consumer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ inputs.consumer_repo }}
          LOOPKEEPER_ROOT: ${{ github.workspace }}/loopkeeper
          PYTHONPATH: ${{ github.workspace }}/loopkeeper/src
          LOOPKEEPER_API_KEY: ${{ secrets.model_api_key }}
          LOOPKEEPER_REVIEW_ENABLED: "true"
          LOOPKEEPER_TRUSTED_SHA: ${{ needs.resolve.outputs.consumer_trusted_sha }}
          LOOPKEEPER_DEFAULT_BRANCH: ${{ needs.resolve.outputs.consumer_default_branch }}
          LOOPKEEPER_MODEL: ${{ vars.LOOPKEEPER_MODEL || 'gpt-5.6-luna' }}
          LOOPKEEPER_REASONING_EFFORT: ${{ vars.LOOPKEEPER_REASONING_EFFORT || 'medium' }}
          LOOPKEEPER_MAX_INPUT_BYTES: ${{ vars.LOOPKEEPER_MAX_INPUT_BYTES || '600000' }}
          # Operator overrides for diff evidence. Empty means derive the
          # per-file cap from the input budget and the changed-file count.
          LOOPKEEPER_PR_FILE_MAX_PATCH_BYTES: ${{ vars.LOOPKEEPER_PR_FILE_MAX_PATCH_BYTES || '' }}
          LOOPKEEPER_PR_FILE_BUDGET_PERCENT: ${{ vars.LOOPKEEPER_PR_FILE_BUDGET_PERCENT || '50' }}
          LOOPKEEPER_MAX_OUTPUT_TOKENS: ${{ vars.LOOPKEEPER_MAX_OUTPUT_TOKENS || '32000' }}
          LOOPKEEPER_MAX_OUTPUT_BYTES: ${{ vars.LOOPKEEPER_MAX_OUTPUT_BYTES || '50000' }}
          LOOPKEEPER_REQUEST_TIMEOUT: ${{ vars.LOOPKEEPER_REQUEST_TIMEOUT || '900' }}
          LOOPKEEPER_JOB_TIMEOUT_SECONDS: ${{ inputs.job_timeout_seconds }}
          LOOPKEEPER_EVENT_NAME: ${{ github.event_name }}
          LOOPKEEPER_PR_ACTION: ${{ github.event.action }}
          LOOPKEEPER_EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha || github.event.workflow_run.head_sha || '' }}
          LOOPKEEPER_CI_WORKFLOW_NAME: ${{ inputs.ci_workflow_name }}
          LOOPKEEPER_CI_WORKFLOW_FILE: ${{ inputs.ci_workflow_file }}
          LOOPKEEPER_POLICY_PATH: ${{ inputs.policy_path }}
          LOOPKEEPER_CONTRACT_PATH: ${{ inputs.contract_path }}
          LOOPKEEPER_CONTEXT_PATH: ${{ inputs.context_path }}
          LOOPKEEPER_OPERATOR: "0"
          LOOPKEEPER_ARTIFACT_DIR: ${{ github.workspace }}/loopkeeper-artifacts
        run: |
          set -euo pipefail
          pr_number="${{ inputs.pr_number }}"
          if [[ "$pr_number" == "0" ]]; then
            pr_number="${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number }}"
          fi
          [[ "$pr_number" =~ ^[1-9][0-9]*$ ]] || { echo "a PR number is required" >&2; exit 2; }
          "$LOOPKEEPER_ROOT/adapters/github/review_pr.sh" "$pr_number"
      - name: Record whether review artifacts exist
        id: artifact_status
        if: always()
        env:
          ARTIFACT_DIR: ${{ github.workspace }}/loopkeeper-artifacts
        run: |
          set -euo pipefail
          if [[ -s "$ARTIFACT_DIR/review.md" && -s "$ARTIFACT_DIR/comment.md" ]]; then
            echo "available=true" >>"$GITHUB_OUTPUT"
          else
            echo "available=false" >>"$GITHUB_OUTPUT"
          fi
      - name: Publish review summary
        if: always()
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || 'unknown' }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha || github.event.workflow_run.head_sha || '' }}
          REVIEW_OUTCOME: ${{ steps.run_review.outcome }}
          ARTIFACT_AVAILABLE: ${{ steps.artifact_status.outputs.available || 'false' }}
          ARTIFACT_NAME: loopkeeper-review-${{ github.run_id }}
          ARTIFACT_DIR: ${{ github.workspace }}/loopkeeper-artifacts
          POST_COMMENTS: ${{ inputs.post_comments }}
        run: |
          set -euo pipefail
          summary_script="$GITHUB_WORKSPACE/loopkeeper/adapters/github/render_summary.sh"
          if [[ -x "$summary_script" ]]; then
            "$summary_script" review
          else
            {
              echo "## Loopkeeper review"
              echo ""
              echo "Summary renderer unavailable because the trusted Loopkeeper checkout did not complete."
              echo "Event: \`$EVENT_NAME\`; PR: #$PR_NUMBER; review step: \`$REVIEW_OUTCOME\`."
            } >>"$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload immutable review artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: loopkeeper-review-${{ github.run_id }}
          path: ${{ github.workspace }}/loopkeeper-artifacts
          if-no-files-found: ignore
          retention-days: 7

  writer:
    if: ${{ inputs.post_comments && needs.review.result == 'success' && needs.review.outputs.artifact_available == 'true' }}
    needs: [resolve, review]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: write
    concurrency:
      group: loopkeeper-pr-review-writer-${{ inputs.consumer_repo }}-${{ inputs.pr_number || github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || github.run_id }}
      cancel-in-progress: false
    steps:
      - name: Check out consumer at forge-verified default-branch SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.consumer_repo }}
          ref: ${{ needs.resolve.outputs.consumer_trusted_sha }}
          path: consumer
          fetch-depth: 1
      - name: Check out Loopkeeper at immutable release SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          repository: ${{ inputs.loopkeeper_repo }}
          ref: ${{ inputs.loopkeeper_sha }}
          path: loopkeeper
          fetch-depth: 1
      - name: Verify both writer checkouts before trusted reads
        env:
          CONSUMER_TRUSTED_SHA: ${{ needs.resolve.outputs.consumer_trusted_sha }}
          LOOPKEEPER_SHA: ${{ inputs.loopkeeper_sha }}
        run: |
          set -euo pipefail
          [[ "$(git -C consumer rev-parse HEAD)" == "$CONSUMER_TRUSTED_SHA" ]]
          [[ "$(git -C loopkeeper rev-parse HEAD)" == "$LOOPKEEPER_SHA" ]]
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Download immutable review artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: loopkeeper-review-${{ github.run_id }}
          path: ${{ github.workspace }}/loopkeeper-review-artifact
      - name: Run explicitly enabled writer
        id: run_writer
        working-directory: consumer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ inputs.consumer_repo }}
          LOOPKEEPER_ROOT: ${{ github.workspace }}/loopkeeper
          PYTHONPATH: ${{ github.workspace }}/loopkeeper/src
          LOOPKEEPER_REVIEW_ARTIFACT: ${{ github.workspace }}/loopkeeper-review-artifact/review.md
          LOOPKEEPER_REVIEW_ENABLED: "true"
          LOOPKEEPER_TRUSTED_SHA: ${{ needs.resolve.outputs.consumer_trusted_sha }}
          LOOPKEEPER_DEFAULT_BRANCH: ${{ needs.resolve.outputs.consumer_default_branch }}
          LOOPKEEPER_MODEL: ${{ vars.LOOPKEEPER_MODEL || 'gpt-5.6-luna' }}
          LOOPKEEPER_REASONING_EFFORT: ${{ vars.LOOPKEEPER_REASONING_EFFORT || 'medium' }}
          LOOPKEEPER_MAX_INPUT_BYTES: ${{ vars.LOOPKEEPER_MAX_INPUT_BYTES || '600000' }}
          # Operator overrides for diff evidence. Empty means derive the
          # per-file cap from the input budget and the changed-file count.
          LOOPKEEPER_PR_FILE_MAX_PATCH_BYTES: ${{ vars.LOOPKEEPER_PR_FILE_MAX_PATCH_BYTES || '' }}
          LOOPKEEPER_PR_FILE_BUDGET_PERCENT: ${{ vars.LOOPKEEPER_PR_FILE_BUDGET_PERCENT || '50' }}
          LOOPKEEPER_MAX_OUTPUT_TOKENS: ${{ vars.LOOPKEEPER_MAX_OUTPUT_TOKENS || '32000' }}
          LOOPKEEPER_MAX_OUTPUT_BYTES: ${{ vars.LOOPKEEPER_MAX_OUTPUT_BYTES || '50000' }}
          LOOPKEEPER_REQUEST_TIMEOUT: ${{ vars.LOOPKEEPER_REQUEST_TIMEOUT || '900' }}
          LOOPKEEPER_JOB_TIMEOUT_SECONDS: ${{ inputs.job_timeout_seconds }}
          LOOPKEEPER_EVENT_NAME: ${{ github.event_name }}
          LOOPKEEPER_PR_ACTION: ${{ github.event.action }}
          LOOPKEEPER_EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha || github.event.workflow_run.head_sha || '' }}
          LOOPKEEPER_CI_WORKFLOW_NAME: ${{ inputs.ci_workflow_name }}
          LOOPKEEPER_CI_WORKFLOW_FILE: ${{ inputs.ci_workflow_file }}
          LOOPKEEPER_OPERATOR: "1"
          LOOPKEEPER_ARTIFACT_DIR: ${{ github.workspace }}/loopkeeper-writer-artifacts
        run: |
          set -euo pipefail
          pr_number="${{ inputs.pr_number }}"
          if [[ "$pr_number" == "0" ]]; then pr_number="${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number }}"; fi
          "$LOOPKEEPER_ROOT/adapters/github/review_pr.sh" "$pr_number"
      - name: Publish writer summary
        if: always()
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || 'unknown' }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha || github.event.workflow_run.head_sha || '' }}
          WRITER_OUTCOME: ${{ steps.run_writer.outcome }}
          WRITER_ARTIFACT_DIR: ${{ github.workspace }}/loopkeeper-writer-artifacts
        run: |
          set -euo pipefail
          summary_script="$GITHUB_WORKSPACE/loopkeeper/adapters/github/render_summary.sh"
          if [[ -x "$summary_script" ]]; then
            "$summary_script" writer
          else
            {
              echo "## Loopkeeper writer"
              echo ""
              echo "Summary renderer unavailable because the trusted Loopkeeper checkout did not complete."
              echo "Event: \`$EVENT_NAME\`; PR: #$PR_NUMBER; writer step: \`$WRITER_OUTCOME\`."
            } >>"$GITHUB_STEP_SUMMARY"
          fi
