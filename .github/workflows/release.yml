name: Loopkeeper Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the package after the human release approval
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build and record provenance
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip build
          python -m build --sdist --wheel
          sha256sum dist/*.whl dist/*.tar.gz > dist/SHA256SUMS
          git rev-parse HEAD > dist/COMMIT_SHA
          python - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          from loopkeeper import __version__

          wheels = sorted(Path("dist").glob("*.whl"))
          if len(wheels) != 1:
              raise SystemExit("release must contain exactly one wheel")
          sdists = sorted(Path("dist").glob("*.tar.gz"))
          if len(sdists) != 1:
              raise SystemExit("release must contain exactly one sdist")
          digest = hashlib.sha256(wheels[0].read_bytes()).hexdigest()
          commit = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          artifacts = [
              {"filename": path.name, "sha256": hashlib.sha256(path.read_bytes()).hexdigest()}
              for path in [*wheels, *sdists]
          ]
          manifest = {
              "schema": 1,
              "version": __version__,
              "commit_sha": commit,
              "package_sha256": digest,
              "artifacts": artifacts,
              "workflow_paths": [
                  ".github/workflows/pr-review.yml",
                  ".github/workflows/pr-review-posting.yml",
                  ".github/workflows/issue-triage.yml",
                  ".github/workflows/issue-triage-readonly.yml",
                  ".github/workflows/agent.yml",
              ],
              "provenance": {"source": "Loopkeeper release pipeline", "builder": "GitHub Actions"},
          }
          Path("dist/release-manifest.json").write_text(json.dumps(manifest, sort_keys=True, indent=2) + "\n", encoding="utf-8")
          PY
          tests/github/test_automation.sh
      - name: Upload package and provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: loopkeeper-release-${{ github.run_id }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
            dist/COMMIT_SHA
            dist/release-manifest.json
          if-no-files-found: error
          retention-days: 30

  publish:
    if: ${{ inputs.publish }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download package and provenance
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: loopkeeper-release-${{ github.run_id }}
          path: dist
      - name: Verify release artifact before publication
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -s dist/SHA256SUMS
          sha256sum --check --strict dist/SHA256SUMS
          python3 release/verify_artifact.py dist "$EXPECTED_COMMIT"
      - name: Publish package with PyPI trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
