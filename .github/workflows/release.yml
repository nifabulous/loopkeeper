name: Loopkeeper Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the package after the human release approval
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build and record provenance
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip build
          python -m build --sdist --wheel
          sha256sum dist/* > dist/SHA256SUMS
          git rev-parse HEAD > dist/COMMIT_SHA
          test -f release/release-manifest.json
          tests/github/test_automation.sh
      - name: Publish package (human-approved phase 1)
        if: ${{ inputs.publish }}
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: echo "Publication requires the protected environment approval and is intentionally explicit."
