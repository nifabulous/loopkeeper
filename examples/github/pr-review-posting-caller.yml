# LOOPKEEPER-TEMPLATE: replace the fixture repository and release SHA before copying.
name: Loopkeeper PR Review (posting)

on:
  pull_request_target:
    # labeled/unlabeled are required: approving or revoking the fork
    # approval label must trigger a fresh eligibility evaluation.
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review
        required: true
        type: number

permissions:
  contents: read
  actions: read
  checks: read
  issues: read
  pull-requests: write

jobs:
  targets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pr_numbers: ${{ steps.select.outputs.pr_numbers }}
    steps:
      - name: Select open PRs at the completed run head
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          DIRECT_PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number || 0 }}
          RUN_SOURCE_EVENT: ${{ github.event.workflow_run.event || '' }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha || '' }}
          RUN_PULL_REQUESTS: ${{ toJSON(github.event.workflow_run.pull_requests) }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GH_REPO" =~ ^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$ ]] || { echo "repository must be owner/name" >&2; exit 2; }
          if [[ "$EVENT_NAME" != "workflow_run" ]]; then
            [[ "$DIRECT_PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || { echo "a PR number is required" >&2; exit 2; }
            echo "pr_numbers=[$DIRECT_PR_NUMBER]" >>"$GITHUB_OUTPUT"
            echo "| Selected PRs | \`[$DIRECT_PR_NUMBER]\` |" >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ "$RUN_SOURCE_EVENT" != "pull_request" || ! "$RUN_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "workflow_run is not a pull_request completion with a full head SHA; selecting no PRs." >&2
            echo 'pr_numbers=[]' >>"$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -z "$RUN_PULL_REQUESTS" || "$RUN_PULL_REQUESTS" == "null" ]]; then RUN_PULL_REQUESTS='[]'; fi
          jq -e 'type == "array"' <<<"$RUN_PULL_REQUESTS" >/dev/null || {
            echo "workflow_run.pull_requests was not an array; selecting no PRs." >&2
            echo 'pr_numbers=[]' >>"$GITHUB_OUTPUT"
            exit 0
          }
          targets_file="$(mktemp)"; response_file="$(mktemp)"
          trap 'rm -f "$targets_file" "$response_file"' EXIT
          declare -A seen=(); selection_unavailable=0
          while IFS= read -r pr; do
            [[ "$pr" =~ ^[1-9][0-9]*$ ]] || continue
            [[ -z "${seen[$pr]+present}" ]] || continue
            seen[$pr]=1
            if ! gh api "repos/${GH_REPO}/pulls/${pr}" --jq '{state: .state, head_sha: (.head.sha // "")}' >"$response_file" 2>/dev/null; then
              echo "could not read PR #${pr}; refusing to guess its current state" >&2
              selection_unavailable=1; continue
            fi
            state="$(jq -r '.state // ""' "$response_file")"
            head_sha="$(jq -r '.head_sha // ""' "$response_file")"
            if [[ "$state" == "open" && "$head_sha" == "$RUN_HEAD_SHA" ]]; then printf '%s\n' "$pr" >>"$targets_file"; fi
          done < <(jq -r '.[].number // empty' <<<"$RUN_PULL_REQUESTS")
          if (( selection_unavailable )); then
            echo "one or more associated PRs were unverifiable; selecting no PRs." >&2
            echo 'pr_numbers=[]' >>"$GITHUB_OUTPUT"; exit 0
          fi
          if [[ -s "$targets_file" ]]; then pr_numbers="$(jq -Rsc 'split("\n") | map(select(length > 0) | tonumber)' <"$targets_file")"; else pr_numbers='[]'; fi
          echo "pr_numbers=$pr_numbers" >>"$GITHUB_OUTPUT"
          {
            echo "## Loopkeeper target selection"; echo ""; echo "| Run head | Selected open exact-head PRs |"; echo "| --- | --- |"; echo "| \`$RUN_HEAD_SHA\` | \`$pr_numbers\` |"
          } >>"$GITHUB_STEP_SUMMARY"

  review:
    needs: targets
    if: ${{ needs.targets.outputs.pr_numbers != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        pr_number: ${{ fromJSON(needs.targets.outputs.pr_numbers) }}
    uses: example-org/loopkeeper/.github/workflows/pr-review-posting.yml@0123456789abcdef0123456789abcdef01234567
    with:
      consumer_repo: ${{ github.repository }}
      loopkeeper_repo: example-org/loopkeeper
      consumer_trusted_sha: ""
      loopkeeper_sha: 0123456789abcdef0123456789abcdef01234567
      ci_workflow_name: CI
      ci_workflow_file: ci.yml
      pr_number: ${{ matrix.pr_number }}
      expected_head_sha: ${{ github.event.workflow_run.head_sha || '' }}
      job_timeout_seconds: 1200
      # Visible PR comments are the default. Set false for an artifact-only run.
      post_comments: true
    secrets:
      model_api_key: ${{ secrets.LOOPKEEPER_API_KEY }}
