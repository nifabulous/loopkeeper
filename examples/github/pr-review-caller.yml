# LOOPKEEPER-TEMPLATE: replace the fixture repository and release SHA before copying.
name: Loopkeeper PR Review

on:
  pull_request_target:
    # labeled/unlabeled are required: approving or revoking the fork
    # approval label must trigger a fresh eligibility evaluation.
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review
        required: true
        type: number

permissions:
  contents: read
  actions: read
  checks: read
  issues: read
  pull-requests: read

jobs:
  review:
    uses: example-org/loopkeeper/.github/workflows/pr-review.yml@0123456789abcdef0123456789abcdef01234567
    with:
      consumer_repo: ${{ github.repository }}
      loopkeeper_repo: example-org/loopkeeper
      consumer_trusted_sha: ""
      loopkeeper_sha: 0123456789abcdef0123456789abcdef01234567
      ci_workflow_name: CI
      ci_workflow_file: ci.yml
      pr_number: ${{ fromJSON(format('{0}', github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || inputs.pr_number || 0)) }}
      expected_head_sha: ${{ github.event.workflow_run.head_sha || '' }}
      job_timeout_seconds: 1200
      post_comments: false
    secrets:
      model_api_key: ${{ secrets.LOOPKEEPER_API_KEY }}
